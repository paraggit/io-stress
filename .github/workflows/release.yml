name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          VERSION="v0.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          build() {
            local goos="$1" goarch="$2"
            local out="dist/odf-io-stress_${VERSION}_${goos}_${goarch}"
            echo "Building ${out}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "${LDFLAGS}" -o "${out}" ./cmd/odf-io-stress/
            chmod +x "${out}"
            (cd dist && sha256sum "$(basename "${out}")" > "$(basename "${out}").sha256")
          }

          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build and push worker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          VERSION="v0.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          GHCR="ghcr.io/${OWNER}/odf-io-stress"
          QUAY="quay.io/paraggit/odf-io-stress"
          tags=(-t "${GHCR}:${VERSION}" -t "${GHCR}:latest")
          push_quay=false
          if [ -n "${QUAY_USERNAME}" ] && [ -n "${QUAY_PASSWORD}" ]; then
            push_quay=true
            tags+=(-t "${QUAY}:${VERSION}" -t "${QUAY}:latest")
          fi
          docker build -f build/Dockerfile \
            --build-arg "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" \
            "${tags[@]}" .
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${GHCR}:${VERSION}"
          docker push "${GHCR}:latest"
          if [ "${push_quay}" = true ]; then
            echo "${QUAY_PASSWORD}" | docker login quay.io -u "${QUAY_USERNAME}" --password-stdin
            docker push "${QUAY}:${VERSION}"
            docker push "${QUAY}:latest"
          else
            echo "Quay credentials are not set; skipping the Quay push"
          fi
